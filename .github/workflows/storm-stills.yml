name: storm-stills
# RIVON THE STORM control stills at FULL quality (LOD0 vegetation, full-res 4k textures, dense lawn) on a 4-core / 16 GB runner.
# Push a branch stills/<name> whose videos/storm/stills.json is e.g.
#   {"name":"q1","w":1080,"h":1920,"spp":256,"shots":["wide","s01","glass"]}
# Each shot renders in its own job; results (raw + photographic post) are published to release stills-<name>.
on:
  push:
    branches: ['stills/**']
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shots: ${{ steps.p.outputs.shots }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: echo "shots=$(jq -c .shots videos/storm/stills.json)" >> $GITHUB_OUTPUT
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shot: ${{ fromJson(needs.plan.outputs.shots) }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h / | tail -1
      - name: Blender + assets
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 libxxf86vm1 libegl1 libxext6 >/dev/null
          cd /tmp && curl -sL -f --retry 3 -o b.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.3-linux-x64.tar.xz && tar xf b.tar.xz && mv blender-5.2.3-linux-x64 blender
          L=$GITHUB_WORKSPACE/videos/storm/lib/polyhaven; mkdir -p $L
          for TAG in lib-set1 lib-set2 lib-set3 lib-set4; do
            gh release download $TAG -R ${{ github.repository }} -p 'polyhaven__*' -D /tmp/rel_$TAG
            for t in /tmp/rel_$TAG/*.tar; do tar -xf $t -C $L; done; rm -rf /tmp/rel_$TAG
          done
          pip install --quiet scipy pillow numpy
          nproc; free -g | head -2; df -h / | tail -1
      - name: Render ${{ matrix.shot }}
        run: |
          cd videos/storm
          W=$(jq -r .w stills.json); H=$(jq -r .h stills.json); SPP=$(jq -r .spp stills.json); NAME=$(jq -r .name stills.json)
          mkdir -p /tmp/out
          TEX_LIMIT=2048 STORM_QUALITY=final /tmp/blender/blender -b --python-exit-code 1 -P scripts/test_frame_blender.py -- /tmp/out/${{ matrix.shot }}_raw.png $W $H $SPP ${{ matrix.shot }} 2>&1 | grep -vE "Fra:|Sample " | tail -40
          python3 scripts/post_photo.py /tmp/out/${{ matrix.shot }}_raw.png /tmp/out/${{ matrix.shot }}_photo.png --seed 7
      - name: Publish
        run: |
          NAME=$(jq -r .name videos/storm/stills.json); TAG=stills-$NAME
          gh release view $TAG -R ${{ github.repository }} >/dev/null 2>&1 || gh release create $TAG -R ${{ github.repository }} --title $TAG --notes "THE STORM control stills $NAME (full quality, CPU runner)" || true
          for i in 1 2 3; do gh release upload $TAG /tmp/out/*.png -R ${{ github.repository }} --clobber && break; sleep 10; done
