name: storm-film
# RIVON THE STORM film frames on free 4-core runners. Push a branch film/<name> whose videos/storm/film.json is e.g.
#   {"name":"anim1","w":270,"h":480,"spp":24,"quality":"preview","tex":1024,"frames":"1-600:3","per_job":10,"fps":10}
# frames "a-b:step". Each job renders per_job frames (stateless: test_frame fNNNN), publishes PNGs to release film-<name>;
# the last job assembles the MP4 (logo + slogan + synthesized sound) and publishes it to the same release.
on:
  push:
    branches: ['film/**']
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.p.outputs.chunks }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          python3 - <<'PY' >> $GITHUB_OUTPUT
          import json
          c = json.load(open("videos/storm/film.json")); r, step = (c["frames"].split(":") + ["1"])[:2]; a, b = map(int, r.split("-"))
          fr = list(range(a, b + 1, int(step))); n = c.get("per_job", 3)
          print("chunks=" + json.dumps([" ".join(map(str, fr[i:i + n])) for i in range(0, len(fr), n)]))
          PY
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.chunks) }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h / | tail -1
          sudo swapoff -a || true; sudo fallocate -l 40G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 && sudo swapon /swapfile2; free -g
      - name: Blender + assets
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 libxxf86vm1 libegl1 libxext6 >/dev/null
          cd /tmp
          # Blender from our own release cache first (download.blender.org drops connections when 20 runners pull at once)
          gh release download lib-blender -R ${{ github.repository }} -p 'blender-5.2.3-linux-x64.tar.xz' -O b.tar.xz 2>/dev/null || true
          for i in 1 2 3 4 5 6 7 8; do
            [ -s b.tar.xz ] && tar tf b.tar.xz >/dev/null 2>&1 && break
            curl -sL -f --retry 3 --retry-all-errors -o b.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.3-linux-x64.tar.xz || curl -sL -f -o b.tar.xz https://mirrors.ocf.berkeley.edu/blender/release/Blender5.2/blender-5.2.3-linux-x64.tar.xz || sleep 30
          done
          tar xf b.tar.xz && mv blender-5.2.3-linux-x64 blender && test -x /tmp/blender/blender
          (gh release view lib-blender -R ${{ github.repository }} >/dev/null 2>&1 || gh release create lib-blender -R ${{ github.repository }} --title lib-blender --notes "Blender binary cache for the render runners") && (gh release view lib-blender -R ${{ github.repository }} --json assets -q '.assets[].name' | grep -q blender-5.2.3 || (cp b.tar.xz blender-5.2.3-linux-x64.tar.xz && gh release upload lib-blender blender-5.2.3-linux-x64.tar.xz -R ${{ github.repository }} --clobber)) || true
          L=$GITHUB_WORKSPACE/videos/storm/lib/polyhaven; mkdir -p $L
          for TAG in lib-set1 lib-set2 lib-set3 lib-set4 lib-set5 lib-set6; do
            gh release download $TAG -R ${{ github.repository }} -p 'polyhaven__*' -D /tmp/rel_$TAG
            for t in /tmp/rel_$TAG/*.tar; do tar -xf $t -C $L; done; rm -rf /tmp/rel_$TAG
          done
          pip install --quiet scipy pillow numpy
          nproc; free -g | head -2; df -h / | tail -1
      - name: Render frames ${{ matrix.chunk }}
        run: |
          cd videos/storm
          W=$(jq -r .w film.json); H=$(jq -r .h film.json); SPP=$(jq -r .spp film.json); NAME=$(jq -r .name film.json)
          Q=$(jq -r .quality film.json); TEX=$(jq -r .tex film.json); TAG=film-$NAME
          gh release view $TAG -R ${{ github.repository }} >/dev/null 2>&1 || gh release create $TAG -R ${{ github.repository }} --title $TAG --notes "THE STORM film frames $NAME" || true
          mkdir -p /tmp/out
          # one asset listing per job (the runner token allows ~1000 API calls/hour for the whole repo)
          for i in 1 2 3 4 5 6; do gh api "repos/${{ github.repository }}/releases/tags/$TAG" --paginate -q '.assets[].name' > /tmp/have.txt && break; sleep 120; done
          for F in ${{ matrix.chunk }}; do
            N=$(printf "f%04d" $F)
            if grep -q "^$N.png$" /tmp/have.txt; then echo "$N exists"; continue; fi
            AERIAL=$([ "$Q" = final ] && echo 1 || echo 0) TEX_LIMIT=$TEX STORM_QUALITY=$Q /tmp/blender/blender -b --python-exit-code 1 -P scripts/test_frame_blender.py -- /tmp/out/${N}_raw.png $W $H $SPP $N > /tmp/out/$N.log 2>&1 || { tail -40 /tmp/out/$N.log; continue; }
            python3 scripts/post_photo.py /tmp/out/${N}_raw.png /tmp/out/$N.png --seed $F
            for i in $(seq 1 16); do gh release upload $TAG /tmp/out/$N.png -R ${{ github.repository }} --clobber && break; echo "upload retry $i"; sleep 150; done
            rm -f /tmp/out/${N}_raw*.png
          done
  assemble:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; pip install --quiet pillow numpy scipy
          cd videos/storm; NAME=$(jq -r .name film.json); TAG=film-$NAME; mkdir -p /tmp/fr
          for i in 1 2 3 4 5 6; do gh release download $TAG -R ${{ github.repository }} -p 'f*.png' -D /tmp/fr --clobber && break; sleep 300; done
          mkdir -p /tmp/sfx && (gh release download lib-sfx -R ${{ github.repository }} -p sfx_pack.tar -O /tmp/sfx_pack.tar && tar -xf /tmp/sfx_pack.tar -C /tmp/sfx) || true
          python3 scripts/finish_storm.py /tmp/fr film.json /tmp/RIVON_THE_STORM_$NAME.mp4 /tmp/sfx
          gh release upload $TAG /tmp/RIVON_THE_STORM_$NAME.mp4 -R ${{ github.repository }} --clobber
