name: fetch-assets
# Downloads free CC0 assets (Poly Haven, ambientCG) on the runner, which has open internet.
# Push a branch assets/<name> with assets_request.json:
#  {"name":"cat1","catalog":true}                                    -> branch lib/cat1 with catalog JSONs
#  {"name":"set1","polyhaven":[{"id":"x","res":"4k","fmt":"blend"}],"ambientcg":[{"id":"Wood049","res":"4K"}]}
on:
  push:
    branches: ['assets/**']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: python3 tools/fetch_assets.py assets_request.json out
      - name: Publish as release (one tar per asset, <2 GB each)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME=$(jq -r .name assets_request.json); TAG=lib-$NAME
          mkdir -p tars
          [ -f out/polyhaven_catalog.json ] && cp out/*.json tars/
          for src in polyhaven ambientcg; do
            [ -d out/$src ] || continue
            for d in out/$src/*/; do a=$(basename $d); tar -C out/$src -cf tars/${src}__$a.tar $a; done
          done
          cp out/errors.json tars/errors.json
          ls -la tars | head -80
          gh release delete $TAG -y --cleanup-tag -R ${{ github.repository }} 2>/dev/null || true
          gh release create $TAG -R ${{ github.repository }} --title "$TAG" --notes "CC0 assets fetched by CI (Poly Haven / ambientCG). Request: $NAME"
          gh release upload $TAG tars/* -R ${{ github.repository }} --clobber
